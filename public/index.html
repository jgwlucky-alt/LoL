<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>롤 팀원 관리 사이트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #0f1117;
    color: #e8e8ec;
    min-height: 100vh;
  }
  header { padding: 28px 20px 12px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.5px; }
  header p { margin: 0; color: #8b8d98; font-size: 13px; }

  .form-card {
    max-width: 520px;
    margin: 20px auto;
    background: #1a1d29;
    border: 1px solid #24273a;
    border-radius: 16px;
    padding: 20px;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #8b8d98; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid #2a2d3a;
    background: #14161f;
    color: #e8e8ec;
    font-size: 14px;
  }
  .line-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .submit-btn {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: #5b8def;
    color: white;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .submit-btn:hover { background: #4a7ad8; }
  .status-msg { text-align: center; font-size: 13px; padding: 4px 0 0; min-height: 18px; }
  .status-msg.error { color: #e05c5c; }
  .status-msg.ok { color: #4caf7d; }

  .roster {
    max-width: 720px;
    margin: 24px auto 60px;
    padding: 0 20px;
  }
  .roster h2 { font-size: 15px; color: #8b8d98; margin-bottom: 12px; }
  .slots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 14px;
  }
  .slot {
    text-align: center;
    cursor: pointer;
  }
  .slot img.icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid #2a2d3a;
    object-fit: cover;
    background: #24273a;
  }
  .slot:hover img.icon { border-color: #5b8def; }
  .slot .nick { font-size: 11px; margin-top: 6px; color: #c8c9d4; word-break: break-all; }
  .slot .lines { font-size: 10px; color: #6a6d7a; margin-top: 2px; }
  .empty { text-align: center; color: #5c5f6d; padding: 30px 0; font-size: 13px; }

  /* 모달 */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #1a1d29;
    border-radius: 16px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-header button {
    background: none; border: none; color: #8b8d98; font-size: 18px; cursor: pointer;
  }
  .tier-chip {
    display: inline-block;
    background: #24273a;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    color: #c8c9d4;
    margin: 3px 4px 3px 0;
  }
  .champ-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid #24273a;
  }
  .champ-row img {
    width: 40px; height: 40px; border-radius: 8px; background: #24273a;
  }
  .champ-row .cname { font-size: 13px; font-weight: 600; }
  .champ-row .cpoints { font-size: 11px; color: #8b8d98; }
  .section-title { font-size: 12px; color: #8b8d98; margin: 14px 0 4px; }
  .modal-loading { text-align: center; padding: 20px; color: #8b8d98; font-size: 13px; }
  .delete-btn {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #402a2a;
    background: #241a1a;
    color: #e0a0a0;
    font-size: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>🛡️ 롤 팀원 관리 사이트</h1>
    <p>닉네임과 라인을 등록하면 팀원 슬롯이 생성돼요</p>
  </header>

  <div class="form-card">
    <div class="field">
      <label>닉네임 / 태그</label>
      <div style="display:flex; gap:8px;">
        <input id="nameInput" type="text" placeholder="닉네임 (예: Hide on bush)" style="flex:2" />
        <input id="tagInput" type="text" placeholder="태그 (예: KR1)" style="flex:1" />
      </div>
    </div>
    <div class="field">
      <label>주라인 / 부라인 / 기피라인</label>
      <div class="line-row">
        <select id="mainLine"></select>
        <select id="subLine"></select>
        <select id="avoidLine"></select>
      </div>
    </div>
    <button class="submit-btn" id="registerBtn">팀원으로 등록하기</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="roster">
    <h2>팀원 명단</h2>
    <div class="slots" id="slots">
      <div class="empty">아직 등록된 팀원이 없어요.</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalName"></h3>
        <button id="closeModal">✕</button>
      </div>
      <div id="modalBody"><div class="modal-loading">불러오는 중...</div></div>
      <button class="delete-btn" id="deleteBtn">이 팀원 명단에서 삭제</button>
    </div>
  </div>

<script>
  const LINES = ["탑", "정글", "미드", "원딜", "서포터"];
  const mainLine = document.getElementById("mainLine");
  const subLine = document.getElementById("subLine");
  const avoidLine = document.getElementById("avoidLine");
  [mainLine, subLine, avoidLine].forEach((sel) => {
    sel.innerHTML = LINES.map((l) => `<option value="${l}">${l}</option>`).join("");
  });

  const nameInput = document.getElementById("nameInput");
  const tagInput = document.getElementById("tagInput");
  const registerBtn = document.getElementById("registerBtn");
  const statusMsg = document.getElementById("statusMsg");
  const slotsEl = document.getElementById("slots");

  const overlay = document.getElementById("overlay");
  const modalName = document.getElementById("modalName");
  const modalBody = document.getElementById("modalBody");
  const closeModal = document.getElementById("closeModal");
  const deleteBtn = document.getElementById("deleteBtn");
  let currentPlayerId = null;

  async function loadRoster() {
    const res = await fetch("/api/players");
    const players = await res.json();
    if (players.length === 0) {
      slotsEl.innerHTML = '<div class="empty">아직 등록된 팀원이 없어요.</div>';
      return;
    }
    slotsEl.innerHTML = players
      .map(
        (p) => `
        <div class="slot" data-id="${p.id}">
          <img class="icon" src="${p.profileIconUrl}" alt="${p.riotId}" />
          <div class="nick">${p.riotId}</div>
          <div class="lines">주:${p.mainLine} 부:${p.subLine}</div>
        </div>`
      )
      .join("");

    document.querySelectorAll(".slot").forEach((el) => {
      el.addEventListener("click", () => openModal(Number(el.dataset.id), el.querySelector(".nick").textContent));
    });
  }

  async function registerPlayer() {
    const name = nameInput.value.trim();
    const tag = tagInput.value.trim();
    if (!name || !tag) {
      statusMsg.textContent = "닉네임과 태그를 모두 입력해주세요.";
      statusMsg.className = "status-msg error";
      return;
    }
    statusMsg.textContent = "등록 중...";
    statusMsg.className = "status-msg";
    try {
      const res = await fetch("/api/players", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name, tag,
          mainLine: mainLine.value,
          subLine: subLine.value,
          avoidLine: avoidLine.value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "등록 실패");
      statusMsg.textContent = `${data.riotId} 등록 완료!`;
      statusMsg.className = "status-msg ok";
      nameInput.value = "";
      tagInput.value = "";
      loadRoster();
    } catch (err) {
      statusMsg.textContent = err.message;
      statusMsg.className = "status-msg error";
    }
  }

  async function openModal(id, riotId) {
    currentPlayerId = id;
    modalName.textContent = riotId;
    modalBody.innerHTML = '<div class="modal-loading">불러오는 중...</div>';
    overlay.classList.add("show");
    try {
      const res = await fetch(`/api/players/${id}/detail`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "조회 실패");

      const tierHtml = data.tiers.length
        ? data.tiers.map((t) => `<span class="tier-chip">${t.queue} ${t.tier} ${t.rank} ${t.lp}LP</span>`).join("")
        : '<span class="tier-chip">언랭크 / 랭크 정보 없음</span>';

      const champHtml = data.mostChampions
        .map(
          (c) => `
          <div class="champ-row">
            <img src="${c.iconUrl || ""}" alt="${c.name}" />
            <div>
              <div class="cname">${c.name}</div>
              <div class="cpoints">숙련도 Lv.${c.level} · ${c.points.toLocaleString()}점</div>
            </div>
          </div>`
        )
        .join("");

      modalBody.innerHTML = `
        <div class="section-title">티어</div>
        ${tierHtml}
        <div class="section-title">모스트 챔피언 TOP 3</div>
        ${champHtml || '<div class="modal-loading">전적 정보가 없어요.</div>'}
      `;
    } catch (err) {
      modalBody.innerHTML = `<div class="modal-loading">${err.message}</div>`;
    }
  }

  closeModal.addEventListener("click", () => overlay.classList.remove("show"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("show"); });

  deleteBtn.addEventListener("click", async () => {
    if (!currentPlayerId) return;
    await fetch(`/api/players/${currentPlayerId}`, { method: "DELETE" });
    overlay.classList.remove("show");
    loadRoster();
  });

  registerBtn.addEventListener("click", registerPlayer);
  loadRoster();
</script>
</body>
</html>
